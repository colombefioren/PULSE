# Local development stack: `docker compose up --build`
# Every value has a development default, so no .env file is needed to start.
# Copy .env.example to .env to override any of them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: src/Pulse.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # nginx is the only caller, so trust its X-Forwarded-* headers. Rate limiting then sees real client addresses.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pulse};Username=${POSTGRES_USER:-pulse};Password=${POSTGRES_PASSWORD:-pulse_dev_password}
      # Local stack only. Deployed environments run migrations from the gated CI job instead.
      Database__MigrateOnStartup: "true"
      # Base address used in the links inside emails.
      App__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      # "Try the demo" signs visitors in to a shared read-only team that watches real public sites. Off by default.
      Demo__Enabled: ${DEMO_ENABLED:-false}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Pulse.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pulse};Username=${POSTGRES_USER:-pulse};Password=${POSTGRES_PASSWORD:-pulse_dev_password}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      # Alert emails and webhooks link back to the incident here.
      App__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      # The API applies migrations at startup in this stack, and checks need the tables it creates.
      api:
        condition: service_started

  web:
    build:
      context: web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pulse-postgres:
